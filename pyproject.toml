[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-metering"
version = "0.2.0"
description = "Universal LLM metering proxy — track cost per customer and per feature"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28.0", "pandas>=2.0.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
example = ["openai>=1.0.0", "anthropic>=0.25.0"]
bigquery = ["google-cloud-bigquery>=3.11.0"]

[project.scripts]
agent-metering = "agent_metering.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_metering*"]

[tool.setuptools.package-data]
agent_metering = ["providers.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
