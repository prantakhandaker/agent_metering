[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-metering"
version = "0.3.0"
description = "Import-once LLM cost metering for B2B SaaS — auto-track spend per customer and feature"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "prantakhandaker" },
]
keywords = [
    "llm",
    "openai",
    "anthropic",
    "cost-tracking",
    "metering",
    "observability",
    "saas",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28.0", "pandas>=2.0.0"]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.21.0"]
example = ["openai>=1.0.0", "anthropic>=0.25.0"]
vertex = ["google-auth>=2.22.0"]

[project.urls]
Homepage = "https://github.com/prantakhandaker/agent_metering"
Repository = "https://github.com/prantakhandaker/agent_metering"
Issues = "https://github.com/prantakhandaker/agent_metering/issues"
Changelog = "https://github.com/prantakhandaker/agent_metering/releases"

[project.scripts]
agent-metering = "agent_metering.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_metering*"]

[tool.setuptools.package-data]
agent_metering = ["providers.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
